name: FPL snapshot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fpl-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stahnout data z FPL API
        run: python fpl-data/scripts/fetch_fpl.py

      - name: Commitnout, pokud se neco zmenilo
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@github.com"
          git add fpl-data/data
          if git diff --staged --quiet; then
            echo "Beze zmeny, necommituju."
          else
            git commit -m "FPL data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
